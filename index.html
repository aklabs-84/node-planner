<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노드 기획 놀이터</title>
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--ink:#23211e;--sub:#6b6862;--mute:#9a968d;--line:#e3e0d8;--dot:#d6d2c6;
  --edge:#a29d92;--accent:#2f6fe4;--accent-bg:#e3edff;--danger:#c0392b;--danger-bg:#fdecea;--ok:#1f6b36;--ok-bg:#ddf3e3;
  --plan-bg:#fff0c2;--plan-fg:#8a5a00;--screen-bg:#dcebff;--screen-fg:#1d55a3;--inp-bg:#ffe0ec;--inp-fg:#a02b5e;
  --data-bg:#ddf3e3;--data-fg:#1f6b36;--res-bg:#ffe5d6;--res-fg:#a04a1f;--ai-bg:#e8e0ff;--ai-fg:#5a3fb0;
  --fin-bg:#d3f0ee;--fin-fg:#0f6663;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1b1a18;--panel:#262522;--ink:#f1efe9;--sub:#b3afa5;--mute:#827e75;--line:#3a3834;--dot:#34322e;
    --edge:#7d786e;--accent:#79a6ff;--accent-bg:#1f3358;--danger:#ff8f82;--danger-bg:#4a2420;--ok:#8fdca3;--ok-bg:#1c3d26;
    --plan-bg:#4a3a10;--plan-fg:#ffd66b;--screen-bg:#1b3555;--screen-fg:#9cc6ff;--inp-bg:#4d2336;--inp-fg:#ffafcb;
    --data-bg:#1c3d26;--data-fg:#8fdca3;--res-bg:#4d3020;--res-fg:#ffb48a;--ai-bg:#34295a;--ai-fg:#c9b8ff;
    --fin-bg:#173f3d;--fin-fg:#86e3de;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
button:hover{border-color:var(--mute)}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0;font-weight:700}
header .sp{flex:1}
.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-right:6px}
.tabs button{border:none;background:none;border-radius:9px;padding:5px 12px;font-weight:600;color:var(--sub)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
#specHint{font-size:12px;color:var(--sub);max-width:300px;line-height:1.3}
main{flex:1;min-height:0;display:grid;grid-template-columns:196px minmax(0,1fr) 340px}
aside{background:var(--panel);overflow:auto}
#pal{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
#pal h2,#side h2{font-size:12px;color:var(--sub);margin:0 0 2px;font-weight:600}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:grab;user-select:none;touch-action:none;flex:none}
.pitem:hover{border-color:var(--mute)}
.pitem .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.pitem b{display:block;font-size:13px;line-height:1.2}
.pitem span.d{font-size:12px;color:var(--sub);line-height:1.2}
[data-c=plan]{--cbg:var(--plan-bg);--cfg:var(--plan-fg)}
[data-c=screen]{--cbg:var(--screen-bg);--cfg:var(--screen-fg)}
[data-c=inp]{--cbg:var(--inp-bg);--cfg:var(--inp-fg)}
[data-c=data]{--cbg:var(--data-bg);--cfg:var(--data-fg)}
[data-c=res]{--cbg:var(--res-bg);--cfg:var(--res-fg)}
[data-c=ai]{--cbg:var(--ai-bg);--cfg:var(--ai-fg)}
[data-c=fin]{--cbg:var(--fin-bg);--cfg:var(--fin-fg)}
.ico{background:var(--cbg)}
#stage{position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:24px 24px;user-select:none}
#cv.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#svg path{fill:none}
#svg .vis{stroke:var(--edge);stroke-width:2.5;stroke-linecap:round}
#svg .vis.sel{stroke:var(--accent);stroke-width:3.5}
#svg .hit{stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
#svg .tmp{stroke:var(--accent);stroke-width:3;stroke-dasharray:7 6}
.node{position:absolute;width:176px;height:76px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);
  border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);cursor:grab;user-select:none;transition:opacity .15s}
.node .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.node .tx{min-width:0}
.node b{display:block;font-size:14px;line-height:1.25}
.node .sm{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.node.sel{border-color:var(--ink);border-width:2.5px}
.node.active{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-bg)}
.node.dim{opacity:.35}
.node.src{border-color:var(--accent)}
.port{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:3px solid var(--cfg);background:var(--panel)}
.port::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.port.in{left:-9px}
.port.out{right:-9px;background:var(--cfg);cursor:crosshair}
.node.cand .port.in{animation:pulse 1s ease-in-out infinite;background:var(--cbg)}
.node.hot{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-bg)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
.elabel{position:absolute;transform:translate(-50%,-50%);padding:2px 10px;border-radius:999px;background:var(--panel);border:1.5px solid var(--edge);font-size:12px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.elabel.empty{border-style:dashed;color:var(--mute)}
.elabel.sel{border-color:var(--accent);color:var(--accent)}
.elabel .ex{display:inline-block;margin-left:8px;padding:0 6px;border-radius:999px;background:var(--danger-bg);color:var(--danger);font-weight:700;cursor:pointer}
#hint{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--sub);box-shadow:var(--shadow);pointer-events:none}
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.zoombar button{box-shadow:var(--shadow);min-width:40px;height:40px}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);max-width:90%;padding:8px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.on{opacity:1}
.emptybox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:var(--panel);border:1.5px dashed var(--mute);border-radius:20px;padding:22px 26px;max-width:80%}
.emptybox b{display:block;font-size:17px;margin-bottom:4px}
.emptybox p{margin:0 0 12px;color:var(--sub);font-size:14px}
.btn-main{background:var(--accent);color:#fff;border-color:var(--accent)}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}
#side{border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card .hd .ico{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.card .hd .tag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--cbg);color:var(--cfg)}
.card .hd .sp{flex:1}
.card label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.card .note{font-size:12px;color:var(--sub);margin-top:8px}
.req{font-size:10px;color:var(--danger);background:var(--danger-bg);border-radius:999px;padding:0 6px;margin-left:4px}
.pks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pks button{padding:2px 10px;border-radius:999px;font-size:12px;background:var(--panel)}
.pks button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
details.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.btn-del{color:var(--danger);border-color:transparent;background:transparent;padding:4px 8px;font-size:13px}
.btn-del:hover{background:var(--danger-bg);border-color:transparent}
.phone{width:236px;margin:0 auto;border:1.5px solid var(--mute);border-radius:30px;padding:10px;background:var(--bg)}
.screen{background:var(--panel);border-radius:22px;min-height:300px;padding:16px;display:flex;flex-direction:column;gap:10px}
.screen .app{font-size:11px;color:var(--mute)}
.screen h3{font-size:19px;line-height:1.3;margin:0}
.screen p{margin:0;font-size:14px;color:var(--sub)}
.screen .fld label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.screen .opt{text-align:left;width:100%;margin-bottom:6px;border-radius:12px}
.screen .opt.on{background:var(--accent-bg);border:1.5px solid var(--accent);color:var(--accent)}
.screen .go{background:var(--accent);color:#fff;border-color:var(--accent);width:100%;padding:10px;border-radius:12px}
.screen .chip{font-size:12px;padding:6px 10px;border-radius:10px;background:var(--bg);color:var(--sub)}
.screen .err{font-size:12px;color:var(--danger)}
.screen .grow{flex:1}
.screen .bar{height:10px;border-radius:5px;background:var(--bg);margin-top:3px}
.screen .bar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.screen .aibox{background:var(--ai-bg);color:var(--ai-fg);border-radius:12px;padding:10px;font-size:13px}
.screen .saved{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:6px 10px;font-size:12px}
.screen .link{border:none;background:none;color:var(--mute);font-size:12px;padding:2px}
/* 이미지·영상 미리보기 */
.qlist{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:12.5px}
.qlist div{padding:5px 10px;border-radius:10px;background:var(--bg);line-height:1.35}
.qlist .ok{color:var(--ok);background:var(--ok-bg)}
.qlist .no{color:var(--danger);background:var(--danger-bg)}
.qlist .opt{color:var(--sub)}
.qtitle{font-size:12px;font-weight:600;color:var(--sub);margin-top:14px}
.imgframe,.vframe{margin:0 auto;border-radius:14px;border:1.5px solid var(--line);background:linear-gradient(135deg,var(--plan-bg),var(--ai-bg));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;gap:6px;overflow:hidden;color:var(--ink)}
.imgframe .big,.vframe .big{font-size:34px;line-height:1}
.imgframe .cap,.vframe .cap{font-size:13px;line-height:1.35;word-break:keep-all}
.imgframe .rt,.vframe .rt{font-size:11px;color:var(--sub);background:var(--panel);border-radius:999px;padding:1px 9px}
.vframe .sub{margin-top:auto;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px}
.sb{display:flex;flex-direction:column;gap:0}
.tile{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.tile.on{border-color:var(--accent);background:var(--accent-bg)}
.tile .tn{width:24px;height:24px;border-radius:50%;background:var(--screen-bg);color:var(--screen-fg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.tile .tb{flex:1;min-width:0}
.tile .tb b{display:block;font-size:13px;line-height:1.25}
.tile .tb span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sec{font-size:12px;color:var(--sub);flex:none}
.trans{font-size:11px;color:var(--mute);text-align:center;line-height:1.6}
.tbar{display:flex;gap:2px;height:10px;margin:6px 0 4px}
.tbar i{display:block;border-radius:3px;background:var(--screen-fg);opacity:.55}
.tbar i.on{opacity:1;background:var(--accent)}
.prtext{white-space:pre-wrap;font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.menuwrap{position:relative}
#menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
#menu[hidden]{display:none}
#menu button{border:none;text-align:left;background:none;border-radius:8px;padding:8px 10px}
#menu button:hover{background:var(--bg)}
#menu small{display:block;color:var(--sub);font-size:11px;line-height:1.3}
#bEdit{display:none}
body.view #bEdit{display:inline-block}
body.view #pal,body.view #inspwrap,body.view .editonly{display:none}
body.view main{grid-template-columns:minmax(0,1fr) 340px}
.protoempty{color:var(--sub);font-size:13px;text-align:center;padding:40px 16px}
#specModal{position:fixed;inset:0;z-index:60;background:rgba(20,20,30,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#specModal[hidden]{display:none}
#specBox{background:var(--panel);color:var(--ink);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(820px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:10px;padding:18px}
#specHead{display:flex;align-items:center;gap:8px}
#specHead h2{margin:0;font-size:17px;flex:1}
#specX{border:none;background:none;font-size:20px;line-height:1;padding:4px 8px}
#specbar{display:none;gap:6px;flex-wrap:wrap;align-items:center}
#specbar label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;width:100%}
#specbar input{width:auto}
#specbar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#spec{flex:1;min-height:260px;height:52vh;font-size:13px;line-height:1.55;resize:none;width:100%}
#specFoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#specmsg{flex:1;font-size:12px;color:var(--sub);min-width:140px}
@media (max-width:1100px){main{grid-template-columns:176px minmax(0,1fr) 300px}}
@media (max-width:900px){
  body{height:auto;min-height:100%;display:block}
  main{display:block}
  #pal{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:10px}
  #pal h2{display:none}
  .pitem{touch-action:pan-x}
  #stage{height:60vh;min-height:380px}
  #side{border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <h1>노드 기획 놀이터</h1>
  <div class="tabs editonly" id="tabs">
    <button data-m="app">📱 앱</button><button data-m="image">🖼️ 이미지</button><button data-m="video">🎬 영상</button>
  </div>
  <button id="bUndo" class="editonly" title="되돌리기 (Ctrl+Z)">되돌리기</button>
  <button id="bSample" class="editonly">예시 불러오기</button>
  <button id="bClear" class="editonly">새로 시작</button>
  <div class="menuwrap editonly">
    <button id="bShare" aria-haspopup="true">저장 · 공유 ▾</button>
    <div id="menu" hidden>
      <button id="mSave">📥 파일로 저장<small>내 컴퓨터에 .json 파일로 내려받아요</small></button>
      <button id="mLoad">📂 파일 불러오기<small>저장해 둔 파일을 열어요</small></button>
      <button id="mEditLink">🔗 편집 링크 복사<small>받은 사람이 고쳐 볼 수 있어요</small></button>
      <button id="mViewLink">👀 보기 전용 링크 복사<small>눌러 보기만 가능해요 (학생 배포용)</small></button>
    </div>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <button id="bEdit" class="btn-main">내 기획으로 가져와 고치기</button>
  <span class="sp"></span>
  <span id="specHint"></span>
  <button id="bSpec" class="btn-main">기획서 만들기</button>
</header>
<main>
  <aside id="pal"></aside>
  <section id="stage">
    <div id="cv">
      <div id="world"><svg id="svg"><g id="eg"></g><g id="tg"></g></svg><div id="nl"></div><div id="ll"></div></div>
      <div id="hint"></div>
      <div id="empty" class="emptybox">
        <b>빈 캔버스예요</b>
        <p>왼쪽 카드를 끌어다 놓아 보세요.<br>눌러도 카드가 생겨요.</p>
        <button id="bSample2" class="btn-main">예시 불러오기</button>
      </div>
      <div class="zoombar"><button id="zOut" aria-label="축소">−</button><button id="zIn" aria-label="확대">＋</button><button id="zFit">전체 보기</button></div>
      <div id="toast" class="toast" role="status"></div>
    </div>
  </section>
  <aside id="side">
    <div id="inspwrap"><h2>카드 · 선 고치기</h2><div id="insp"></div></div>
    <div><h2 id="protoh">눌러 보는 프로토타입</h2><div id="proto"></div></div>
    <div>
      <div id="clBox" class="card" hidden>
        <b style="font-size:13px">🏫 클래스로그AI 수업</b>
        <div class="note" id="clWho"></div>
        <button id="bSubmit" class="btn-main" style="margin-top:8px;width:100%">클래스로그AI에 제출하기</button>
        <div class="note" id="clMsg"></div>
      </div>
    </div>
  </aside>
</main>
<div id="specModal" hidden role="dialog" aria-modal="true" aria-labelledby="specTitle">
  <div id="specBox">
    <div id="specHead"><h2 id="specTitle">기획서</h2><button id="specX" aria-label="닫기">✕</button></div>
    <div id="specbar">
      <button id="bCopyDoc">기획서 전체</button><button id="bCopyPr">프롬프트만</button>
      <label><input type="checkbox" id="en"> 영어 프롬프트로 바꿔 달라는 줄도 넣기</label>
    </div>
    <textarea id="spec" readonly></textarea>
    <div id="specFoot"><span id="specmsg"></span><button id="bCopyNow" class="btn-main">복사하기</button><button id="bSpecClose">닫기</button></div>
  </div>
</div>
<script>
(function(){
'use strict';
var W=176,H=76,KEY='node-planner-v2',KEY1='node-planner-v1';

/* ---------- 카드 정의 ---------- */
function F(k,l,t,d,o,x){x=x||{};return {k:k,l:l,t:t,d:d,o:o||null,ph:x.ph||'',more:!!x.more,req:!!x.req}}
var TYPES={},ALLOW={};
function T(id,m,c,ic,nm,d,sum,tag,f,note){TYPES[id]={m:m,c:c,ic:ic,nm:nm,d:d,sum:sum,tag:tag,f:f,note:note||''}}

  try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.boards)return o}catch(e){}

/* ---------- 연결 규칙 ---------- */
function canConnect(a,b){
  if(!a||!b)return {ok:false,msg:''};
  if(a.id===b.id)return {ok:false,msg:'자기 자신에게는 이을 수 없어요'};
  if(S.edges.some(function(e){return e.from===a.id&&e.to===b.id}))return {ok:false,msg:'이미 이어져 있어요'};
  if(ALLOW[a.type].indexOf(b.type)<0){
    var names=ALLOW[a.type].map(function(t){return TYPES[t].nm}).join(', ');
    return {ok:false,msg:TYPES[a.type].nm+' 카드는 '+(names?names+' 카드로만 이을 수 있어요':'다른 카드로 이을 수 없어요 (맨 끝 카드예요)')}}
  return {ok:true,msg:''}
}

function addNode(type,x,y){push();var n={id:'n'+(++S.seq),type:type,x:Math.round(x),y:Math.round(y),f:{}};
  TYPES[type].f.forEach(function(f){n.f[f.k]=f.d});
  if(type==='screen')n.f.name='화면 '+(S.nodes.filter(function(q){return q.type==='screen'}).length+1);
  S.nodes.push(n);sel={kind:'node',id:n.id};refreshAll();inspector();return n}
function addEdge(a,b){push();var e={id:'e'+(++S.seq),from:a,to:b,label:''};S.edges.push(e);sel={kind:'edge',id:e.id};refreshAll();inspector(true)}
function removeSel(){if(!sel)return;push();
  if(sel.kind==='node'){S.nodes=S.nodes.filter(function(n){return n.id!==sel.id});S.edges=S.edges.filter(function(e){return e.from!==sel.id&&e.to!==sel.id})}
  else S.edges=S.edges.filter(function(e){return e.id!==sel.id});
  sel=null;refreshAll();inspector()}
function setSel(s){sel=s;syncNodes();drawEdges();hint();inspector()}

/* ---------- 화면 이동 · 확대 ---------- */
function applyView(){world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')';
  cv.style.backgroundPosition=view.x+'px '+view.y+'px';var g=24*view.k;cv.style.backgroundSize=g+'px '+g+'px';persist()}
function toWorld(cx,cy){var r=cv.getBoundingClientRect();return {x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k}}
function zoomAt(cx,cy,f){var r=cv.getBoundingClientRect(),k=Math.max(.3,Math.min(1.6,view.k*f)),px=cx-r.left,py=cy-r.top;
  view.x=px-(px-view.x)*(k/view.k);view.y=py-(py-view.y)*(k/view.k);view.k=k;applyView()}
function fit(){var r=cv.getBoundingClientRect();if(!S.nodes.length){view={x:60,y:80,k:1};applyView();return}
  var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;S.nodes.forEach(function(n){x1=Math.min(x1,n.x);y1=Math.min(y1,n.y);x2=Math.max(x2,n.x+W);y2=Math.max(y2,n.y+H)});
  var k=Math.max(.3,Math.min(1.1,Math.min((r.width-80)/(x2-x1),(r.height-120)/(y2-y1))));
  view.k=k;view.x=(r.width-(x2-x1)*k)/2-x1*k;view.y=(r.height-(y2-y1)*k)/2-y1*k+16;applyView()}
function centerWorld(){var r=cv.getBoundingClientRect();return toWorld(r.left+r.width/2,r.top+r.height/2)}

function makeNode(n){var t=TYPES[n.type],el=document.createElement('div');el.className='node';el.dataset.id=n.id;el.dataset.c=t.c;
  el.innerHTML='<div class="ico">'+t.ic+'</div><div class="tx"><b>'+t.nm+'</b><span class="sm"></span></div>'+(hasIn(n.type)?'<i class="port in"></i>':'')+(hasOut(n.type)?'<i class="port out"></i>':'');
  nl.appendChild(el);els[n.id]=el;return el}
function syncNodes(){
  var ids={};S.nodes.forEach(function(n){ids[n.id]=1;var el=els[n.id]||makeNode(n);
    el.style.left=n.x+'px';el.style.top=n.y+'px';el.querySelector('.sm').textContent=fv(n,TYPES[n.type].sum)||'(비어 있어요)';
    el.classList.toggle('sel',!!sel&&sel.kind==='node'&&sel.id===n.id);el.classList.toggle('active',n.id===P.cur)});
  Object.keys(els).forEach(function(id){if(!ids[id]){els[id].remove();delete els[id]}});
}

var IDRE=/^[A-Za-z0-9_-]{1,20}$/;
function clean(o){/* 파일·링크로 들어온 데이터를 믿지 않고 걸러 낸다 */
  if(!o||!Array.isArray(o.nodes)||!Array.isArray(o.edges))return null;
  var mode=MODES[o.mode]?o.mode:'app';
  var ids={},eids={},nodes=[],edges=[],seq=0;
  o.nodes.slice(0,300).forEach(function(n){
    if(!n||typeof n.type!=='string'||!TYPES.hasOwnProperty(n.type)||TYPES[n.type].m!==mode||typeof n.id!=='string'||!IDRE.test(n.id)||ids[n.id])return;
    var f={};TYPES[n.type].f.forEach(function(d){var v=n.f&&n.f[d.k];
      v=typeof v==='string'?v.slice(0,600):d.d;if(d.t==='select'&&d.o.indexOf(v)<0)v=d.d;f[d.k]=v});
    ids[n.id]=n.type;nodes.push({id:n.id,type:n.type,x:Math.round(+n.x)||0,y:Math.round(+n.y)||0,f:f})});
  o.edges.slice(0,600).forEach(function(e){
    if(!e||typeof e.id!=='string'||!IDRE.test(e.id)||eids[e.id]||!ids[e.from]||!ids[e.to])return;
    if(e.from===e.to||ALLOW[ids[e.from]].indexOf(ids[e.to])<0)return;
    eids[e.id]=1;edges.push({id:e.id,from:e.from,to:e.to,label:typeof e.label==='string'?e.label.slice(0,100):''})});
  nodes.concat(edges).forEach(function(x){var m=x.id.match(/(\d+)$/);if(m)seq=Math.max(seq,+m[1])});
  return {mode:mode,nodes:nodes,edges:edges,seq:seq}}

function b64u(u8){var s='';for(var i=0;i<u8.length;i+=8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function enc(obj){var bytes=new TextEncoder().encode(JSON.stringify(obj)),pre='r';
  if(window.CompressionStream){bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());pre='z'}
  return pre+b64u(bytes)}
async function dec(s){var bytes=unb64u(s.slice(1));
  if(s[0]==='z')bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes))}
